name: Deploy Backend Java Parser Service

on:
  push:
    branches:
      - '**'
    paths:
      - 'backend/java/parser_service**'
      - 'devops/dev/backend/java/parser_service**'
  workflow_dispatch:

concurrency:
  group: deploy-backend-java-parser_service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    outputs:
      container_logs: ${{ steps.set_logs_output.outputs.container_logs }}
      stdout: ${{ steps.deploy_and_check.outputs.stdout }}
    steps:
      - name: Deploy backend to Server over SSH
        id: deploy_and_check
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.CICD_SSH_HOST }}
          username: ${{ secrets.CICD_SSH_USER }}
          key: ${{ secrets.CICD_SSH_PRIVATE_KEY }}
          script: |

            set -euo pipefail

            # set variables
            BRANCH="${{ github.ref_name }}"
            REPO_DIR="/home/${{ secrets.CICD_SSH_USER }}/VORIQ"
            #SERVICE_DIR="backend/java/security_service"
            IMAGE="dev_parser_service"
            TAG_BRANCH="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g' | sed -E 's#^-+|-+$##g' | cut -c1-120)-latest"
            TAG_SHA="${{ github.sha }}"
            TAG_LAT="latest"
            TAG=$TAG_LAT
            CONTAINER="dev_parser_service" 

            # Ensure the VORIQ directory exists
            [ -d "$REPO_DIR/.git" ] || git clone https://github.com/in49-380/VORIQ.git "$REPO_DIR"

            # Change to the VORIQ directory
            cd "$REPO_DIR"

            # get the latest changes
            git fetch --all --prune
            git checkout -B "$BRANCH" "$TAG_SHA"
            git reset --hard "$TAG_SHA"
            git pull origin "$BRANCH"
            git clean -fdx

            # go to the code directory  
            cd "$REPO_DIR/frontend"
        
            # prepare .enf for front
            echo '${{ secrets.DEV_FRONT_GOOGLE_CLIENT_ID }}' > .env
            echo "VITE_SWAGGER_DOMAIN=http://172.17.0.8" >> .env
            echo "VITE_SWAGGER_PORT=8084" >> .env

            # go to the infrastructure directory  
            cd "$REPO_DIR/devops"

            # prepare .enf for infrastructure
            rm -f .env
            echo 'DB_NAME=${{ secrets.DB_NAME }}' >> .env
            echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env
            echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env
            echo 'DB_NAME_SECURITY=${{ secrets.DB_NAME_SSERVICE }}' >> .env
            echo 'DB_NAME_CAR=${{ secrets.DB_NAME_CAR }}' >> .env
            echo 'DB_NAME_PARSER=${{ secrets.DB_NAME_PARSER }}' >> .env
            
            
            # build new image and restart container with new image
            ENV=dev && ENV=$ENV docker compose --env-file .env --env-file .env."$ENV" up -d --no-deps --build back-java-parser

            # clean up old images to save space
            #docker image prune -f 
            # remove dangling images
            #docker image prune -f --filter "dangling=true"
            # another remove string
            docker image rm -f $(docker image ls -aq) || true
            # if images wont be deleted, uncomment the next line
            #docker image ls "$IMAGE" -q | xargs -n 1 docker rmi -f

            # wait few seconds, until container is run
            sleep 20

            # get container id of the just started container
            CONTAINER_ID=$(ENV=dev && ENV=$ENV docker compose --env-file .env --env-file .env."$ENV" ps -q back-java-parser)

            # checking container status.
            if [ "$(docker inspect -f {{.State.Running}} $CONTAINER_ID)" != "true" ] || [ "$(docker inspect -f {{.State.Restarting}} $CONTAINER_ID)" = "true" ] ; then
                echo "Container failed to start. Capturing logs..." >&2
                # getting last log strings.
                LOGS=$(docker logs --tail 50 $CONTAINER_ID 2>&1)
                # LOGS=$(docker logs --tail 50 $CONTAINER_ID 2>&1 | base64)
                docker logs --tail 50 $CONTAINER_ID 2>&1
                
                # creating output variable 'container_logs' with logs content and transfer to github actions output
                # v1
                # echo "::set-output name=container_logs::string from previous job" # old method
                # v2
                echo "container_logs=string from previous job 222" >> $GITHUB_OUTPUT
                # v3
                # echo "container_logs<<EOF" >> $GITHUB_OUTPUT
                # echo "$LOGS" >> $GITHUB_OUTPUT
                # echo "EOF" >> $GITHUB_OUTPUT
                
                # exiting with failure, so all job ends with failure.
                exit 1 
            fi

      - name: Set logs output for failed run
        id: set_logs_output
        if: failure()
        run: |
          LOGS_FROM_SSH="${{ steps.deploy_and_check.outputs.stdout }}"
          echo "container_logs<<EOF" >> $GITHUB_OUTPUT
          echo "$LOGS_FROM_SSH" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  print_on_failure:
    runs-on: ubuntu-latest
    needs: build_and_deploy
    if: failure()
    steps:
      - name: print logs
        run: |
          echo "LOGS:"
          echo "1 - ${{ needs.build_and_deploy.outputs.container_logs }}"
          echo "2 - ${{ needs.build_and_deploy.outputs.stdout }}"
          echo "3 - ${{ job.build_and_deploy.steps.deploy_and_check.outputs.container_logs }}"
          echo "4 - ${{ job.build_and_deploy.steps.deploy_and_check.outputs.stdout }}"
          echo "5 - ${{ needs.build_and_deploy.outputs.step_container_logs }}"
          echo "6 - ${{ needs.build_and_deploy.outputs.step_stdout }}"
          echo "7 - ${{ job.build_and_deploy.steps.deploy_and_check.outputs.step_container_logs }}"
          echo "8 - ${{ job.build_and_deploy.steps.deploy_and_check.outputs.step_stdout }}"
          echo "9 - $container_logs"
          echo "10 - $stdout"
          echo "11 - $step_container_logs"
          echo "12 - $step_stdout"
        env:
          container_logs: ${{ needs.build_and_deploy.outputs.container_logs }}
          stdout: ${{ needs.build_and_deploy.outputs.stdout }}
          step_container_logs: ${{ job.build_and_deploy.steps.deploy_and_check.outputs.container_logs }}
          step_stdout: ${{ job.build_and_deploy.steps.deploy_and_check.outputs.stdout }}

  notify_on_failure:
    runs-on: ubuntu-latest
    needs: build_and_deploy
    if: failure()
    steps:
      - name: Send a Discord notification
        uses: appleboy/discord-action@master
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }} # WebHook URL
          # webhook_id: ${{ secrets.DISCORD_WEBHOOK_URL }} # WebHook ID
          # webhook_token: ${{ secrets.DISCORD_WEBHOOK_URL }} # WebHook Token
          message: |
            :x: **Deploy is failed!**
            
            **Repo**: `${{ github.repository }}`
            **Branch**: `${{ github.ref_name }}`
            **Commit**: `${{ github.sha }}`
            **Deploy log**: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            
            \`\`\`
            **LOGS:**
            ${{ needs.build_and_deploy.outputs.container_logs }}
            `${{ needs.build_and_deploy.outputs.container_logs }}`
            ${{ job.build_and_deploy.steps.deploy_and_check.outputs.container_logs }}
            `${{ job.build_and_deploy.steps.deploy_and_check.outputs.container_logs }}`
            ${{ needs.build_and_deploy.outputs.stdout }}
            `${{ needs.build_and_deploy.outputs.stdout }}'
            ${{ job.build_and_deploy.steps.deploy_and_check.outputs.stdout }}
            `${{ job.build_and_deploy.steps.deploy_and_check.outputs.stdout }}`

            \`\`\`
        env:

      
