# nginx.conf

# Глобальные настройки
daemon off;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024; # Количество одновременных соединений
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Настройки логирования
    access_log /var/log/nginx/access.log;

    # Настройки для передачи реальных IP и для sticky sessions
    # Эти директивы обычно ставятся в http блок или server блок
    # Но для простоты, их можно вынести сюда, если вы не используете сложные логические блоки
    # Для sticky sessions, это будет настроено в upstream блоке

    sendfile        on;
    keepalive_timeout 65;

    # Настройка SSL (если требуется)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    # ---------- Блоки Upstream (Балансировка нагрузки) ----------
    # Здесь мы определяем группы серверов, между которыми Nginx будет распределять трафик

    # Upstream для вашего front-node сервиса
    upstream front_node_upstream {
        # server - указывает адрес и порт вашего сервиса
        # docker-compose автоматически разрешает имена сервисов в IP-адреса
        server front-node:3000; 

        # sticky cookie my_sticky_cookie expires=1h path=/; # Пример для sticky sessions

        # Можно добавить больше серверов, если у вас несколько реплик
        # server front-node-replica-2:3000; 
        # server front-node-replica-3:3000;
    }

    # Upstream для другого сервиса (например, API)
    upstream api_upstream {
        server api-service:8080;
        # server api-service-2:8080;
    }

    # ---------- Блоки Server (Виртуальные хосты) ----------
    # Определяют, как Nginx обрабатывает запросы для конкретных доменов и портов

    # Server блок для проксирования на front-node (например, через порт 80)
    server {
        listen 80; # Nginx слушает на порту 80 хоста
        server_name voriq.info; # Домен, который будет обрабатываться этим блоком

        location / {
            proxy_pass http://front_node_upstream; # Используем наш upstream для балансировки

            # Заголовки для передачи информации клиенту
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Если вам нужна SSL/HTTPS, добавьте сюда блок listen 443 ssl; и настройки SSL
        # listen 443 ssl;
        # server_name voriq.info;
        # ssl_certificate /etc/letsencrypt/live/voriq.info/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/voriq.info/privkey.pem;
        # ... другие SSL настройки
    }

    # Server блок для проксирования на API (например, через порт 8080)
    server {
        listen 8080; # Nginx слушает на порту 8080 хоста
        server_name api.voriq.info; # Домен для API

        location / {
            proxy_pass http://api_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Если вам нужен отдельный сервер для обработки requests с портом 8080
    # server {
    #     listen 8080; # Nginx слушает на порту 8080 хоста
    #     server_name voriq.info; # Тот же домен, но на другом порту
    #
    #     location / {
    #         proxy_pass http://another-service:1234; # Проксируем на другой сервис
    #         proxy_set_header Host $host:$server_port; # Передаем Host с портом
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}

 ports:
      # Маппинг портов: HOST_PORT:CONTAINER_PORT
      # Nginx будет слушать на порту 80 хоста, а в контейнере - на порту 80
      - "80:80" 
      # Если вы хотите, чтобы Nginx слушал на порту 8080 хоста, а в контейнере на 80:
      # - "8080:80" 
      # Если вы хотите, чтобы Nginx слушал на порту 8080 хоста, а в контейнере на 3030:
      # - "8080:3030"

      # Если вы хотите прослушивать HTTPS (требует SSL-сертификатов)
      # - "443:443" 
volumes:
      # Монтируем ваш основной конфиг Nginx
      - ./nginx.conf:/etc/nginx/nginx.conf:ro 
      # Если вы используете separate files for server blocks (e.g., in conf.d):
      # - ./nginx/conf.d:/etc/nginx/conf.d:ro 

Как это работает:
1 - Nginx как Прокси: Вы запускаете отдельный контейнер nginx (вместо NPM).

2 - Конфигурация nginx.conf: В этом файле вы определяете:

upstream блоки: Для каждого сервиса, на который вы хотите проксировать, вы создаете upstream блок. Он содержит адреса и порты ваших бэкенд-сервисов (server name:port). Nginx автоматически разрешит имена сервисов (например, front-node, api-service) в их IP-адреса в Docker-сети.

server блоки: Каждый server блок отвечает за обработку запросов для определенного домена и порта.

listen 80; (или listen 8080;): Указывает, на каком порту будет слушать Nginx на хосте.

server_name voriq.info;: Указывает, для какого домена предназначен этот server блок.

location / { ... }: Определяет, как обрабатывать запросы.

proxy_pass http://upstream_name;: Перенаправляет запрос на один из серверов из соответствующего upstream блока.

proxy_set_header ...: Передает информацию о клиенте бэкенд-сервису.

3 - Docker Compose:

Сервис nginx-proxy запускает Nginx.

ports: Здесь вы указываете, какие порты хоста будут маппироваться на порты контейнера Nginx. Если вы хотите, чтобы Nginx слушал на порту 80 хоста, а в контейнере внутри он слушает на 80, то ports: - "80:80". Если хотите, чтобы Nginx слушал на хосте 3030, а в контейнере на 80, то ports: - "3030:80".

volumes: Монтируем ваш nginx.conf в контейнер.

Ваши бэкенд-сервисы (например, front-node) запускаются также в Docker Compose и подключаются к той же сети (app-network). Их порты 3000 (внутренние) могут быть маппированы на хост, если они нужны для прямого доступа, но для Nginx это не обязательно.

Важные моменты:
Sticky Sessions: Если вам нужны sticky сессии, добавьте директиву sticky в ваш upstream блок, как показано в примере nginx.conf.

SSL/HTTPS: Для работы с HTTPS вам потребуется получить SSL-сертификаты (например, через Let's Encrypt) и настроить соответствующие listen 443 ssl; блоки в Nginx, а также монтировать сертификаты в контейнер.

vite.config.js: Если ваш front-node приложение ожидает Host заголовок с портом (например, voriq.info:8080), то вам нужно настроить proxy_set_header Host $host:$server_port; в nginx.conf и обновить allowedHosts в vite.config.js соответственно ("voriq.info:8080").

Этот подход дает вам полный контроль над конфигурацией Nginx, но требует более глубокого понимания его работы.