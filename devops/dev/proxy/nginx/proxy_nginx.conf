user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


# ------------------------------------------


http {
    # --- Блок MAP для HSTS (Безопасность) ---
    # Создает переменную $hsts_header, если протокол HTTPS
    map $scheme $hsts_header {
    https "max-age=3600; preload";
    # https "max-age=0";  # set max-age equal to 0 to disable HSTS
}
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # --- ДИРЕКТИВЫ ПРОИЗВОДИТЕЛЬНОСТИ ---
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    gzip               on;
    # ------------------------------------

    include /etc/nginx/conf.d/*.conf;
    

    # --- UPSTREAM BLOCKS ---
    upstream front_upstream {
        server front-node:3000;
    }

    upstream security_upstream {
            server back-java-security:8080;
    }

    upstream car_upstream {
            server back-java-car:8080;
    }

    upstream parser_upstream {
            server back-java-parser:8080;
    }

    upstream qa_upstream {
        server qa-nginx;
        #server 172.21.0.3;
    }
    # -----------------------


    # 1. Блок для редиректа HTTP -> HTTPS (СЛУШАЕТ ПОРТ 80)
    server {
        listen 80;
        listen [::]:80;
        server_name voriq.info;

        # Исключение для Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Редирект всего остального трафика
        return 301 https://$host$request_uri;
    }

    # 2. Блок для HTTPS-трафика (СЛУШАЕТ ПОРТ 443)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name voriq.info;

        # --- НАСТРОЙКИ SSL (ОБЯЗАТЕЛЬНО ИЗМЕНИТЬ ПУТИ) ---
        ssl_certificate /etc/letsencrypt/live/voriq.info/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/voriq.info/privkey.pem;
        # ----------------------------------------------------

        # --- ПРИМЕНЕНИЕ HSTS ---
        add_header Strict-Transport-Security $hsts_header always;
        # -------------------------
        
        location /security/ 
        {
            # Используем upstream для проксирования
            proxy_pass http://172.20.0.3:8080/; 

            # Добавление необходимых заголовков
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /car/
        {
            proxy_pass http://car_upstream/;
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /parser/
        {
            proxy_pass http://parser_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /qa/
        {
            proxy_pass http://qa_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location /
        {
            proxy_pass http://front_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}