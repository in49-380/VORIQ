name: Deploy Backend Java Car Catalog Service

on:
  push:
    branches:
      - '**'
    paths:
      - 'backend/java/car_catalog_service**'
      - 'devops/backend/java/car_catalog_service**'
  workflow_dispatch:

concurrency:
  group: deploy-backend-java-car_catalog_service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to Server over SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.CICD_SSH_HOST }}
          username: ${{ secrets.CICD_SSH_USER }}
          key: ${{ secrets.CICD_SSH_PRIVATE_KEY }}
          script: |

            set -euo pipefail

            # set variables
            BRANCH="${{ github.ref_name }}"
            REPO_DIR="/home/${{ secrets.CICD_SSH_USER }}/VORIQ"
            #SERVICE_DIR="backend/java/security_service"
            IMAGE="dev_car_catalog_service"
            TAG_BRANCH="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g' | sed -E 's#^-+|-+$##g' | cut -c1-120)-latest"
            TAG_SHA="${{ github.sha }}"
            TAG_LAT="latest"
            TAG=$TAG_LAT
            CONTAINER="dev_car_catalog_service" 

            # Ensure the VORIQ directory exists
            if [ ! -d "$REPO_DIR/.git" ]; then
            git clone https://github.com/in49-380/VORIQ.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            # Fetch all updates from origin
            git fetch --all --prune

            # Checkout the branch from origin, reset to match remote exactly
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fdx

            # go to the code directory
            cd /home/${{ secrets.CICD_SSH_USER }}/VORIQ/backend/java/car_catalog_service



            # build new image
            docker image build --no-cache \
              -t "$IMAGE:$TAG" \
              -f "$REPO_DIR/devops/backend/java/car_catalog_service/Dockerfile" .

            #docker tag "$IMAGE:$TAG_SHA" "$IMAGE:$TAG_BRANCH"
            #docker tag "$IMAGE:$TAG_SHA" "$IMAGE:TAG_LAT"

            # remove old container if exists
            docker container stop "$CONTAINER" || true
            docker container rm -f "$CONTAINER" || true

            # running new docker container
            docker container run -d \
            --restart unless-stopped \
            --name $CONTAINER \
            -p 8084:8084 \
            -v $CONTAINER_log:/opt/app/logs \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e PORT=8084 \
            -e DB_HOST=172.18.0.2 \
            -e DB_PORT=5432 \
            -e DB_NAME=cars \
            -e DB_USERNAME=postgres \
            -e DB_PASSWORD=postgres \
            -e REDIS_HOST=172.17.0.5 \
            -e REDIS_PORT=6379 \
            -e ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://voriq.info:3000,http://172.17.0.3:3000 \
            -e ACCESS_TOKEN_EXPIRATION_MS=900000 \
            -e MAX_TOKEN=5 \
            -e ISSUE_RATE_LIMIT=5000 \
            -e VALIDATE_RATE_LIMIT=300 \
            -e BLOCKED_PREFIX="block:" \
            -e LOG_PATH=/opt/app/logs \
            -e JAVA_OPTS="-XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication -Duser.timezone=Europe/Berlin" \
            -e LOG_DIR=/opt/app/logs \
            -e FIXED_DELAY_MS=259200000 \
            -e INITIAL_DELAY_MS=60000 \
            -e TMP_TOKEN_1=3f2f9b4a-26a7-4b0c-a1b2-7e7e05f3c4d1 \
            -e TMP_TOKEN_2=c1a81c55-78db-4df9-9c39-2a9df7e9b46d \
            -e TMP_TOKEN_3=8d74f2d1-4c2e-4c90-b58b-1ac9e3c0a527 \
            --add-host host.docker.internal:host-gateway \
            $IMAGE:$TAG && \
            docker network connect dbnetwork $CONTAINER

            # clean up old images to save space
            #docker image prune -f 
            # remove dangling images
            #docker image prune -f --filter "dangling=true"
            # another remove string
            docker image rm -f $(docker image ls -aq)
            # if images wont be deleted, uncomment the next line
            #docker image ls "$IMAGE" -q | xargs -n 1 docker rmi -f
