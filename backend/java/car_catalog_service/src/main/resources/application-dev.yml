server:
  port: ${PORT:8084}
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  application:
    name: car_catalog_service

  datasource:
    voriq:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB2_NAME:voriq_cars}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  pg:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    admin-db: ${DB_ADMIN:postgres}
    app-db: ${DB2_NAME:voriq_cars}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

tmp-token:
  1: ${TMP_TOKEN_1}
  2: ${TMP_TOKEN_2}
  3: ${TMP_TOKEN_3}
  prefix: "${TMP_TOKEN_PREFIX:tmp-token: }"