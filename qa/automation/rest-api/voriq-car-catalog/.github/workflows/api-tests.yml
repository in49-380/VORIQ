name: 🚗 VORIQ Car Catalog API Tests (Self-Healing)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    - cron: '0 3 * * *'  # Ежедневно в 03:00 UTC

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Newman & Allure Reporter
        run: |
          npm install -g newman newman-reporter-allure

      - name: 🧪 Run Self-Healing API Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          cd qa/automation/rest-api/voriq-car-catalog
          newman run collections/Voriq_Self-Healing_Test.postman_collection.json \
            --env-var "baseUrl=$BASE_URL" \
            --env-var "accessToken=$ACCESS_TOKEN" \
            --reporters cli,allure \
            --reporter-allure-export ./newman/

      - name: 📤 Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: qa/automation/rest-api/voriq-car-catalog/newman/